[project]
name = "decompnet"
version = "0.10.7"
description = "decomp.wtf (What The Function): your AI agent decompiles games you own into C that compiles to the exact same bytes, with a live view. Runs locally."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "licenses/synaptic-sms-MIT.txt"]
authors = [
    { name = "sam wolfs", email = "appelsiensam@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "capstone>=5.0.9",
    "mcp>=2.3.0",
    "pyelftools>=0.33",
    "splat64[mips]>=0.50.1",
    "spimdisasm>=1.42.4",
    "rabbitizer>=1.16.2",
    "py65>=1.2.0",  # Commodore 64: run unpackers and assemble documented 6510 routines
    "httpx>=0.28",
    "cryptography>=44",  # rooms' keys (Ed25519): a room shows it's the one its members joined, wherever it is
    "uvicorn>=0.30",
    "ninja>=1.11",  # builds GameCube/Wii (dtk) and other ninja-based decomp projects
    "truststore>=0.10; sys_platform == 'win32'",  # HTTPS verified by Windows itself (see decompnet/__init__.py)
    "zstandard>=0.23; sys_platform == 'linux'",  # the .zst runtime old compilers need, without the zstd command
]

[project.urls]
Homepage = "https://github.com/SynapticDreams/decomp.wtf"
Source = "https://github.com/SynapticDreams/decomp.wtf"

[project.scripts]
decompnet = "decompnet.cli:main"
decomp = "decompnet.app.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# the room tests drive the room server through Starlette's TestClient, which warns about the timeouts real clients use
filterwarnings = ["ignore:You should not use the 'timeout' argument with the TestClient"]

[tool.ruff.lint]
# real problems only (what CI checks): undefined or unused names, syntax errors; no style rules
select = ["F", "E9"]
