name: SMS assembly

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sms-assembly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DECOMPNET_TOOLCHAINS: ${{ github.workspace }}/build/sms-toolchains
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run decompnet toolchain install wla-dx
      - run: uv run python tools/sms_gate.py
